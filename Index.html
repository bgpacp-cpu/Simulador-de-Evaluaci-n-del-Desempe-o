<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvalúaRH · Evaluación de Desempeño</title>
<style>
:root{
  --bg:#F5F6FB;
  --surface:#FFFFFF;
  --surface-alt:#F0F1FA;
  --ink:#1E2130;
  --ink-soft:#5B5F73;
  --ink-faint:#8A8DA0;
  --border:#E2E4F0;
  --border-soft:#EDEEF6;
  --primary:#4338CA;
  --primary-dark:#332C9C;
  --primary-soft:#EEF0FD;
  --dim-a:#0D9488; --dim-a-soft:#E6F7F5;
  --dim-b:#7C3AED; --dim-b-soft:#F2EBFE;
  --dim-c:#D97706; --dim-c-soft:#FDF1E1;
  --dim-d:#E11D48; --dim-d-soft:#FDE7EC;
  --rate-5:#059669; --rate-5-soft:#E3F6EE;
  --rate-4:#2563EB; --rate-4-soft:#E7EFFD;
  --rate-3:#D97706; --rate-3-soft:#FDF1E1;
  --rate-2:#EA580C; --rate-2-soft:#FDEAE0;
  --rate-1:#DC2626; --rate-1-soft:#FCE7E7;
  --shadow-sm:0 2px 6px -2px rgba(30,33,48,.08);
  --shadow-md:0 8px 24px -8px rgba(30,33,48,.14), 0 2px 6px -2px rgba(30,33,48,.08);
  --shadow-lg:0 20px 48px -12px rgba(30,33,48,.22);
  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:22px;
  --font-display:"Segoe UI Semibold","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --font-body:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"Consolas","SF Mono","Cascadia Mono",Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--primary);color:#fff;}
a{color:var(--primary);}
.eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink-faint);
}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
:focus-visible{outline:3px solid #A5ADFF;outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}

/* ===== Shell ===== */
.shell{max-width:1180px;margin:0 auto;padding:0 24px 80px;}
.topbar{
  background:linear-gradient(180deg,#211B5A 0%, #332C9C 55%, var(--primary) 100%);
  color:#fff;
  padding:20px 24px 0;
}
.topbar-inner{max-width:1180px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.brand-mark{flex:none;}
.brand-text h1{font-size:19px;color:#fff;}
.brand-text .tagline{font-size:12px;color:#C7C4F2;font-family:var(--font-mono);letter-spacing:.04em;}
.tabs{display:flex;gap:4px;overflow-x:auto;}
.tab-btn{
  background:transparent;border:none;color:#C7C4F2;
  padding:12px 18px;font-size:14px;font-weight:600;border-radius:10px 10px 0 0;
  white-space:nowrap;transition:background .15s,color .15s;border-bottom:3px solid transparent;
}
.tab-btn:hover{color:#fff;background:rgba(255,255,255,.08);}
.tab-btn.active{color:#fff;background:var(--bg);color:var(--primary-dark);}
.tab-count{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:20px;
  background:#EC4899;color:#fff;font-size:10.5px;font-weight:700;
}

/* ===== Cards / generic ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);}
.card-pad{padding:28px;}
.section-title{font-size:22px;margin-bottom:4px;}
.section-sub{color:var(--ink-soft);font-size:14px;margin-bottom:20px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
@media (max-width:820px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

/* ===== Buttons ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:12px;border:1px solid transparent;
  font-size:14px;font-weight:600;transition:transform .12s,box-shadow .12s,background .12s,opacity .12s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 18px -6px rgba(67,56,202,.55);}
.btn-primary:hover{background:var(--primary-dark);}
.btn-primary:disabled{background:#C9CBE8;box-shadow:none;cursor:not-allowed;color:#8B8EB5;}
.btn-ghost{background:var(--surface-alt);color:var(--ink);border-color:var(--border);}
.btn-ghost:hover{background:var(--border-soft);}
.btn-outline{background:transparent;color:var(--primary);border-color:var(--primary);}
.btn-outline:hover{background:var(--primary-soft);}
.btn-danger{background:transparent;color:var(--rate-1);border-color:transparent;}
.btn-danger:hover{background:var(--rate-1-soft);}
.btn-sm{padding:8px 14px;font-size:12.5px;border-radius:9px;}
.btn-block{width:100%;}
.btn-icon{padding:9px;border-radius:10px;}

/* ===== Forms ===== */
.field{margin-bottom:18px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.01em;}
.field .hint{font-size:11.5px;color:var(--ink-faint);margin-top:5px;}
.field input[type=text],.field input[type=date],.field select,.field textarea{
  width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:11px;
  font-size:14.5px;color:var(--ink);background:#fff;transition:border-color .12s,box-shadow .12s;
}
.field textarea{resize:vertical;min-height:64px;}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft);outline:none;
}
.required-mark{color:var(--rate-1);}

/* ===== Wizard layout ===== */
.wizard{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:start;margin-top:28px;}
@media (max-width:900px){.wizard{grid-template-columns:1fr;}}
.stepper{position:sticky;top:20px;display:flex;flex-direction:column;gap:2px;}
@media (max-width:900px){.stepper{position:static;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:6px;}}
.step-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink-soft);}
.step-item.done{color:var(--ink);}
.step-item.current{background:var(--surface);box-shadow:var(--shadow-sm);color:var(--ink);}
.step-dot{
  flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:12px;font-weight:700;border:2px solid var(--border);background:#fff;color:var(--ink-faint);
}
.step-item.current .step-dot{border-color:var(--primary);color:var(--primary);background:var(--primary-soft);}
.step-item.done .step-dot{border-color:var(--rate-5);background:var(--rate-5);color:#fff;}
.step-label{font-size:13px;font-weight:600;white-space:nowrap;}

.progress-track{height:8px;border-radius:20px;background:var(--surface-alt);overflow:hidden;margin:18px 0 0;}
.progress-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--primary),#818CF8);transition:width .3s ease;}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-faint);margin-top:8px;font-family:var(--font-mono);}

/* ===== Question card ===== */
.q-block{padding:22px 0;border-bottom:1px solid var(--border-soft);}
.q-block:last-child{border-bottom:none;}
.q-text{font-size:15.5px;font-weight:600;margin-bottom:14px;}
.rate-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.rate-btn{
  flex:1;min-width:96px;padding:10px 8px;border-radius:11px;border:1.5px solid var(--border);
  background:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .12s;
}
.rate-btn .num{font-family:var(--font-mono);font-weight:700;font-size:16px;}
.rate-btn .lbl{font-size:10.5px;color:var(--ink-faint);text-align:center;line-height:1.2;}
.rate-btn:hover{border-color:var(--primary);}
.rate-btn.sel-1{background:var(--rate-1-soft);border-color:var(--rate-1);} .rate-btn.sel-1 .num{color:var(--rate-1);}
.rate-btn.sel-2{background:var(--rate-2-soft);border-color:var(--rate-2);} .rate-btn.sel-2 .num{color:var(--rate-2);}
.rate-btn.sel-3{background:var(--rate-3-soft);border-color:var(--rate-3);} .rate-btn.sel-3 .num{color:var(--rate-3);}
.rate-btn.sel-4{background:var(--rate-4-soft);border-color:var(--rate-4);} .rate-btn.sel-4 .num{color:var(--rate-4);}
.rate-btn.sel-5{background:var(--rate-5-soft);border-color:var(--rate-5);} .rate-btn.sel-5 .num{color:var(--rate-5);}
.rate-btn.sel-1 .lbl,.rate-btn.sel-2 .lbl,.rate-btn.sel-3 .lbl,.rate-btn.sel-4 .lbl,.rate-btn.sel-5 .lbl{color:inherit;font-weight:700;}
.dim-tag{
  display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:6px;
}
.wizard-actions{display:flex;justify-content:space-between;margin-top:24px;padding-top:20px;border-top:1px solid var(--border-soft);}

/* ===== Results ===== */
.res-header{
  background:linear-gradient(135deg,#332C9C,var(--primary) 60%,#5B4FE0);
  color:#fff;border-radius:var(--radius-lg);padding:32px;position:relative;overflow:hidden;
}
.res-header .meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px;}
@media (max-width:820px){.res-header .meta-grid{grid-template-columns:repeat(2,1fr);}}
.res-header .meta-item .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#C7C4F2;font-family:var(--font-mono);}
.res-header .meta-item .v{font-size:14.5px;font-weight:600;margin-top:3px;}
.badge-row{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-top:26px;}
.badge-score{
  width:120px;height:120px;border-radius:50%;background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;box-shadow:var(--shadow-lg);flex:none;
}
.badge-score .n{font-family:var(--font-mono);font-size:34px;font-weight:700;line-height:1;}
.badge-score .of5{font-size:11px;color:var(--ink-faint);}
.badge-rating{padding:10px 20px;border-radius:14px;font-weight:700;font-size:16px;}

.dim-card{border-radius:var(--radius-md);padding:18px;border:1.5px solid var(--border);}
.dim-card .dc-top{display:flex;justify-content:space-between;align-items:flex-start;}
.dim-card .dc-score{font-family:var(--font-mono);font-size:26px;font-weight:700;}
.dim-card .dc-bar{height:6px;border-radius:6px;background:#00000012;margin-top:12px;overflow:hidden;}
.dim-card .dc-bar-fill{height:100%;border-radius:6px;}

.radar-wrap{display:flex;align-items:center;justify-content:center;padding:10px;}
.radar-svg{width:100%;max-width:320px;height:auto;}

.list-highlight{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
.list-highlight li{
  display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;
  border-radius:12px;background:var(--surface-alt);border:1px solid var(--border-soft);
}
.list-highlight .txt{font-size:13.5px;font-weight:600;}
.list-highlight .dim{font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);}
.list-highlight .score{font-family:var(--font-mono);font-weight:700;font-size:15px;flex:none;}

.plan-table{width:100%;border-collapse:collapse;}
.plan-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);padding:8px 10px;border-bottom:2px solid var(--border);}
.plan-table td{padding:6px;vertical-align:top;border-bottom:1px solid var(--border-soft);}
.plan-table input,.plan-table textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;}
.sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:8px;}
@media (max-width:600px){.sig-grid{grid-template-columns:1fr;}}
.sig-line{border-top:2px solid var(--ink);margin-top:46px;padding-top:8px;font-size:12px;color:var(--ink-soft);}
.sig-box input{width:100%;border:none;border-bottom:1.5px dashed var(--border);padding:10px 4px;font-family:var(--font-display);font-size:15px;background:transparent;}
.sig-box input:focus{outline:none;border-bottom-color:var(--primary);}

/* ===== KPI / Summary ===== */
.kpi{border-radius:var(--radius-md);padding:20px;color:#fff;position:relative;overflow:hidden;}
.kpi .kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-mono);opacity:.85;}
.kpi .kpi-value{font-family:var(--font-mono);font-size:32px;font-weight:700;margin-top:6px;}
.kpi.k1{background:linear-gradient(135deg,#4338CA,#6366F1);}
.kpi.k2{background:linear-gradient(135deg,#0D9488,#14B8A6);}
.kpi.k3{background:linear-gradient(135deg,#059669,#10B981);}
.kpi.k4{background:linear-gradient(135deg,#DC2626,#EF4444);}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:22px 0 14px;}
.search-input{padding:11px 14px;border:1.5px solid var(--border);border-radius:11px;font-size:14px;min-width:220px;}
.data-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.data-table thead th{
  text-align:left;padding:12px 14px;background:var(--surface-alt);color:var(--ink-soft);
  font-size:11px;text-transform:uppercase;letter-spacing:.06em;position:sticky;top:0;
}
.data-table thead th:first-child{border-radius:12px 0 0 12px;}
.data-table thead th:last-child{border-radius:0 12px 12px 0;}
.data-table tbody td{padding:13px 14px;border-bottom:1px solid var(--border-soft);}
.data-table tbody tr:hover{background:#FAFAFE;}
.pill{display:inline-flex;align-items:center;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;}
.row-actions{display:flex;gap:6px;}
.empty-state{text-align:center;padding:60px 24px;color:var(--ink-soft);}
.empty-state .big{font-size:44px;margin-bottom:8px;}

/* ===== Manual ===== */
.manual details{border:1px solid var(--border);border-radius:14px;margin-bottom:10px;background:#fff;overflow:hidden;}
.manual summary{padding:16px 18px;font-weight:700;font-size:14.5px;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;}
.manual summary::-webkit-details-marker{display:none;}
.manual summary::after{content:"+";font-size:20px;color:var(--primary);font-weight:400;}
.manual details[open] summary::after{content:"–";}
.manual .m-body{padding:0 18px 18px;color:var(--ink-soft);font-size:14px;line-height:1.7;}
.manual .m-body p{margin-bottom:10px;}
.manual .m-body ol,.manual .m-body ul{margin:0 0 10px;padding-left:20px;}
.manual .m-body li{margin-bottom:6px;}
.manual .m-body code{font-family:var(--font-mono);background:var(--surface-alt);padding:1px 6px;border-radius:5px;font-size:12.5px;}

/* ===== Toast ===== */
.toast{
  position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:14px 20px;border-radius:12px;
  box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:600;z-index:999;display:flex;align-items:center;gap:10px;
  animation:toast-in .25s ease;
}
.toast.ok{background:#0E4B3A;} .toast.err{background:#5C1414;} .toast.info{background:#1E2130;}
@keyframes toast-in{from{transform:translateY(12px);opacity:0;}to{transform:translateY(0);opacity:1;}}

/* ===== Print ===== */
.no-print{}
@media print{
  body{background:#fff;}
  .topbar,.no-print{display:none !important;}
  body *{visibility:hidden;}
  .printable-area,.printable-area *{visibility:visible;}
  .printable-area{position:absolute;left:0;top:0;width:100%;padding:0;margin:0;box-shadow:none;border:none;}
  .res-header{background:#332C9C !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .shell{padding:0;max-width:100%;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-root"></div>
<script>
/* =========================================================================
   EvalúaRH — Sistema de Evaluación de Desempeño
   Aplicación autónoma (HTML + CSS + JS). Sin librerías externas.
   ========================================================================= */

/* ---------- Configuración de dimensiones y preguntas ---------- */
const DIMENSIONS = [
  { id:'A', name:'Desempeño de funciones', short:'Desempeño', color:'var(--dim-a)', hex:'#0D9488', soft:'var(--dim-a-soft)', levels:null,
    questions:[
      {id:'A1', text:'Calidad del trabajo entregado'},
      {id:'A2', text:'Cumplimiento de metas y plazos'},
      {id:'A3', text:'Conocimiento técnico del puesto'},
      {id:'A4', text:'Productividad'}
    ]},
  { id:'B', name:'Competencias conductuales', short:'Competencias', color:'var(--dim-b)', hex:'#7C3AED', soft:'var(--dim-b-soft)', levels:null,
    questions:[
      {id:'B1', text:'Trabajo en equipo'},
      {id:'B2', text:'Comunicación'},
      {id:'B3', text:'Iniciativa y proactividad'},
      {id:'B4', text:'Resolución de problemas'},
      {id:'B5', text:'Adaptabilidad al cambio'}
    ]},
  { id:'C', name:'Actitud y disciplina laboral', short:'Actitud', color:'var(--dim-c)', hex:'#D97706', soft:'var(--dim-c-soft)', levels:null,
    questions:[
      {id:'C1', text:'Puntualidad y asistencia'},
      {id:'C2', text:'Cumplimiento de normas y políticas internas'},
      {id:'C3', text:'Relaciones interpersonales'},
      {id:'C4', text:'Compromiso institucional'}
    ]},
  { id:'D', name:'Liderazgo', short:'Liderazgo', color:'var(--dim-d)', hex:'#E11D48', soft:'var(--dim-d-soft)', levels:['Directivo','Supervisión'],
    questions:[
      {id:'D1', text:'Capacidad de dirección de equipos'},
      {id:'D2', text:'Toma de decisiones'},
      {id:'D3', text:'Delegación y seguimiento'}
    ]}
];
const RATING_LABELS = {5:'Excelente',4:'Muy bueno',3:'Satisfactorio',2:'Necesita mejorar',1:'Insatisfactorio'};
const NIVELES = ['Directivo','Supervisión','Operativo'];
const LS_EVALS = 'evaluarh_v1_evaluaciones';
const LS_DRAFT = 'evaluarh_v1_borrador';

/* ---------- Utilidades ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'ev_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function fmtScore(n){ return (Math.round(n*10)/10).toFixed(1); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }

function applicableDimensions(nivel){
  return DIMENSIONS.filter(d => !d.levels || d.levels.includes(nivel));
}
function ratingFor(score){
  if(score>=4.5) return {label:'Excelente', key:5, var:'--rate-5', soft:'--rate-5-soft'};
  if(score>=3.8) return {label:'Muy bueno', key:4, var:'--rate-4', soft:'--rate-4-soft'};
  if(score>=3.0) return {label:'Satisfactorio', key:3, var:'--rate-3', soft:'--rate-3-soft'};
  if(score>=2.0) return {label:'Necesita mejorar', key:2, var:'--rate-2', soft:'--rate-2-soft'};
  return {label:'Insatisfactorio', key:1, var:'--rate-1', soft:'--rate-1-soft'};
}
function dimAverage(dim, respuestas){
  const vals = dim.questions.map(q=>respuestas[q.id]).filter(v=>v!=null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function computeScores(ev){
  const dims = applicableDimensions(ev.nivel);
  const perDim = dims.map(d=>({ dim:d, avg: dimAverage(d, ev.respuestas) }));
  const validAvgs = perDim.filter(p=>p.avg!=null).map(p=>p.avg);
  const overall = validAvgs.length ? validAvgs.reduce((a,b)=>a+b,0)/validAvgs.length : 0;
  return { perDim, overall, rating: ratingFor(overall) };
}
function allQuestionScores(ev){
  const dims = applicableDimensions(ev.nivel);
  const list = [];
  dims.forEach(d=>d.questions.forEach(q=>{
    if(ev.respuestas[q.id]!=null) list.push({id:q.id, text:q.text, dimId:d.id, dimName:d.short, color:d.hex, score:ev.respuestas[q.id]});
  }));
  return list;
}
function topBottom(ev, n=3){
  const list = allQuestionScores(ev);
  const top = [...list].sort((a,b)=>b.score-a.score || a.text.localeCompare(b.text)).slice(0,n);
  const bottom = [...list].sort((a,b)=>a.score-b.score || a.text.localeCompare(b.text)).slice(0,n);
  return {top, bottom};
}

/* ---------- Estado de la aplicación ---------- */

function wizardSteps(draft){
  return ['general', ...applicableDimensions(draft.nivel).map(d=>d.id)];
}

function showToast(msg, type){
  type = type || 'info';
  const tid = Date.now()+Math.random();
  state.toast = {msg, type, tid};
  renderToast();
  setTimeout(()=>{ if(state.toast && state.toast.tid===tid){ state.toast=null; renderToast(); } }, 3200);
}
function renderToast(){
  const root = document.getElementById('toast-root');
  if(!state.toast){ root.innerHTML=''; return; }
  const icon = state.toast.type==='ok'?'✓':state.toast.type==='err'?'⚠':'ℹ';
  root.innerHTML = `<div class="toast ${esc(state.toast.type)}"><span>${icon}</span><span>${esc(state.toast.msg)}</span></div>`;
}

/* Actualiza un campo de texto del borrador SIN re-renderizar (evita perder el foco) */
function updateDraftField(key, value){
  state.draft[key] = value;
  saveDraft();
  refreshLiveBits();
}
function updateComment(qid, value){
  state.draft.comentarios[qid] = value;
  saveDraft();
}
function updatePlanField(idx, key, value){
  state.draft.plan[idx][key] = value;
  saveDraft();
}
function updateSignature(key, value){
  state.draft[key] = value;
  saveDraft();
}
/* Actualiza pequeños fragmentos visibles (contador, botón habilitado) sin redibujar todo */
function refreshLiveBits(){
  const btn = document.getElementById('btn-start-eval');
  if(btn){ btn.disabled = !(state.draft.nombre.trim() && state.draft.cargo.trim() && state.draft.departamento.trim()); }
}

/* ---------- Navegación del asistente ---------- */
function setRating(qid, value){
  state.draft.respuestas[qid] = value;
  saveDraft();
  render();
}
function currentDimId(){
  const steps = wizardSteps(state.draft);
  return steps[state.step];
}
function dimComplete(dim){
  return dim.questions.every(q => state.draft.respuestas[q.id]!=null);
}
function goNext(){
  const steps = wizardSteps(state.draft);
  const key = steps[state.step];
  if(key==='general'){
    if(!state.draft.nombre.trim() || !state.draft.cargo.trim() || !state.draft.departamento.trim()){
      showToast('Completa nombre, cargo y departamento para continuar.','err'); return;
    }
    if(!state.draft.nivel){ showToast('Selecciona el nivel del colaborador.','err'); return; }
  } else {
    const dim = DIMENSIONS.find(d=>d.id===key);
    if(!dimComplete(dim)){ showToast('Califica todas las preguntas de esta sección.','err'); return; }
  }
  if(state.step < steps.length-1){ state.step++; render(); window.scrollTo(0,0); }
  else { state.view='results'; render(); window.scrollTo(0,0); }
}
function goBack(){
  if(state.step>0){ state.step--; render(); window.scrollTo(0,0); }
}
function goToStep(i){
  const steps = wizardSteps(state.draft);
  if(i < state.step){ state.step = i; render(); window.scrollTo(0,0); }
}
function backToWizardFromResults(){
  state.view='wizard';
  state.step = wizardSteps(state.draft).length - 1;
  render(); window.scrollTo(0,0);
}

/* ---------- Plan de acción ---------- */
function addPlanRow(){
  state.draft.plan.push({objetivo:'',accion:'',fecha:''});
  render();
}
function removePlanRow(idx){
  state.draft.plan.splice(idx,1);
  if(!state.draft.plan.length) state.draft.plan.push({objetivo:'',accion:'',fecha:''});
  render();
}

/* ---------- Guardar / eliminar evaluaciones ---------- */
function saveEvaluationAndReset(){
  const scores = computeScores(state.draft);
  const record = JSON.parse(JSON.stringify(state.draft));
  record.overall = scores.overall;
  record.ratingLabel = scores.rating.label;
  record.guardadoEn = Date.now();
  state.evaluations.push(record);
  saveEvaluations();
  clearDraftStorage();
  state.draft = emptyDraft();
  state.step = 0;
  state.view = 'summary';
  showToast('Evaluación guardada correctamente.','ok');
  render(); window.scrollTo(0,0);
}
function discardDraft(){
  if(!confirm('¿Descartar esta evaluación en curso? Se perderá la información no guardada.')) return;
  clearDraftStorage();
  state.draft = emptyDraft();
  state.step = 0;
  state.view = 'wizard';
  render();
}
function deleteEvaluation(id){
  const ev = state.evaluations.find(e=>e.id===id);
  if(!ev) return;
  if(!confirm(`¿Eliminar la evaluación de "${ev.nombre}"? Esta acción no se puede deshacer.`)) return;
  state.evaluations = state.evaluations.filter(e=>e.id!==id);
  saveEvaluations();
  showToast('Registro eliminado.','ok');
  render();
}
function openReport(id){
  state.reportTargetId = id;
  state.view = 'report';
  render(); window.scrollTo(0,0);
}

/* ---------- Exportar / importar respaldo JSON ---------- */
function exportBackup(){
  const payload = { app:'EvalúaRH', version:1, exportadoEn:new Date().toISOString(), evaluaciones: state.evaluations };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `evaluarh-respaldo-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Respaldo descargado.','ok');
}
function triggerImport(){ document.getElementById('import-file-input').click(); }
function handleImportFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      const list = Array.isArray(data) ? data : data.evaluaciones;
      if(!Array.isArray(list)) throw new Error('formato inválido');
      const existingIds = new Set(state.evaluations.map(x=>x.id));
      let added = 0;
      list.forEach(rec=>{ if(rec && rec.id && !existingIds.has(rec.id)){ state.evaluations.push(rec); existingIds.add(rec.id); added++; } });
      saveEvaluations();
      showToast(`Se importaron ${added} evaluación(es).`, 'ok');
      render();
    }catch(err){ showToast('El archivo no es un respaldo válido de EvalúaRH.','err'); }
  };
  reader.readAsText(file);
  input.value='';
}

/* ---------- Gráfico radar (SVG puro, sin librerías) ---------- */
function polarPoint(cx,cy,r,angle){ return {x: cx + r*Math.cos(angle), y: cy + r*Math.sin(angle)}; }
function radarChart(perDim, size){
  size = size || 280;
  const n = perDim.length;
  if(n<3){
    // con menos de 3 ejes un radar no es legible; usamos barras horizontales en su lugar
    return null;
  }
  const center = size/2, radius = size/2 - 46;
  const angleStep = (2*Math.PI)/n;
  let grid = '';
  for(let l=1;l<=5;l++){
    const r = radius*(l/5);
    const pts = perDim.map((p,i)=>polarPoint(center,center,r,angleStep*i-Math.PI/2)).map(p=>p.x+','+p.y).join(' ');
    grid += `<polygon points="${pts}" fill="none" stroke="#E2E4F0" stroke-width="1"/>`;
  }
  const axes = perDim.map((p,i)=>{ const pt=polarPoint(center,center,radius,angleStep*i-Math.PI/2); return `<line x1="${center}" y1="${center}" x2="${pt.x.toFixed(1)}" y2="${pt.y.toFixed(1)}" stroke="#E2E4F0"/>`; }).join('');
  const dataPts = perDim.map((p,i)=>{ const val = clamp((p.avg||0)/5,0,1); return polarPoint(center,center,radius*val,angleStep*i-Math.PI/2); });
  const dataPoly = dataPts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const dots = dataPts.map((p,i)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" fill="${perDim[i].dim.hex}" stroke="#fff" stroke-width="1.5"/>`).join('');
  const labels = perDim.map((p,i)=>{
    const pt = polarPoint(center,center,radius+30,angleStep*i-Math.PI/2);
    const anchor = Math.abs(pt.x-center)<6 ? 'middle' : (pt.x>center?'start':'end');
    return `<text x="${pt.x.toFixed(1)}" y="${pt.y.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" font-size="12" font-weight="700" fill="${p.dim.hex}">${esc(p.dim.short)} · ${p.avg!=null?fmtScore(p.avg):'—'}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" class="radar-svg" role="img" aria-label="Gráfico de dimensiones evaluadas">
    ${grid}${axes}
    <polygon points="${dataPoly}" fill="#4338CA26" stroke="#4338CA" stroke-width="2.5"/>
    ${dots}${labels}
  </svg>`;
}

/* ---------- Generador de informe ejecutivo (texto narrativo) ---------- */
function generateNarrative(ev, scores){
  const nombre = ev.nombre || 'El/la colaborador(a)';
  const overall = scores.overall;
  const rating = scores.rating.label;
  const sorted = [...scores.perDim].filter(p=>p.avg!=null).sort((a,b)=>b.avg-a.avg);
  const fuerte = sorted[0];
  const debil = sorted[sorted.length-1];
  const {top, bottom} = topBottom(ev,3);

  let apertura;
  if(overall>=4.5) apertura = `${nombre} tuvo un desempeño sobresaliente durante el período evaluado, alcanzando un promedio general de ${fmtScore(overall)} sobre 5.0, calificado como "${rating}". Los resultados reflejan un desempeño consistente y por encima de las expectativas del puesto.`;
  else if(overall>=3.8) apertura = `${nombre} presentó un desempeño sólido durante el período evaluado, con un promedio general de ${fmtScore(overall)} sobre 5.0, calificado como "${rating}". El resultado indica un cumplimiento adecuado de las expectativas, con oportunidades puntuales de crecimiento.`;
  else if(overall>=3.0) apertura = `${nombre} obtuvo un promedio general de ${fmtScore(overall)} sobre 5.0 durante el período evaluado, calificado como "${rating}". El desempeño se ubica dentro de un rango aceptable, aunque existen áreas concretas que ameritan atención y seguimiento.`;
  else if(overall>=2.0) apertura = `${nombre} obtuvo un promedio general de ${fmtScore(overall)} sobre 5.0 durante el período evaluado, calificado como "${rating}". Los resultados evidencian brechas relevantes frente a las expectativas del puesto que requieren un plan de mejora estructurado.`;
  else apertura = `${nombre} obtuvo un promedio general de ${fmtScore(overall)} sobre 5.0 durante el período evaluado, calificado como "${rating}". Los resultados son significativamente inferiores a lo esperado para el puesto y requieren intervención inmediata por parte de la jefatura y Recursos Humanos.`;

  let parrafoDims = '';
  if(fuerte && debil && fuerte.dim.id!==debil.dim.id){
    parrafoDims = `La dimensión con mejor desempeño fue "${fuerte.dim.name}" (${fmtScore(fuerte.avg)}/5.0), mientras que "${debil.dim.name}" (${fmtScore(debil.avg)}/5.0) representa el área que requiere mayor atención dentro del plan de desarrollo.`;
  } else if(fuerte){
    parrafoDims = `Todas las dimensiones evaluadas mostraron un comportamiento homogéneo, con "${fuerte.dim.name}" como referencia principal (${fmtScore(fuerte.avg)}/5.0).`;
  }

  const fortalezasTxt = top.length ? `Entre las fortalezas más destacadas se encuentran: ${top.map(t=>`"${t.text}" (${t.score}/5)`).join(', ')}.` : '';
  const oportunidadesTxt = bottom.length ? `Como áreas de oportunidad prioritarias se identifican: ${bottom.map(t=>`"${t.text}" (${t.score}/5)`).join(', ')}.` : '';

  let cierre;
  if(overall>=3.8) cierre = `Se recomienda reconocer el desempeño demostrado y mantener el acompañamiento habitual, enfocando el plan de acción en fortalecer aún más las áreas de oportunidad identificadas y en preparar posibles rutas de crecimiento dentro de la organización.`;
  else if(overall>=3.0) cierre = `Se recomienda dar seguimiento cercano al plan de acción acordado, con revisiones periódicas junto a la jefatura inmediata para asegurar avances medibles en las áreas de oportunidad señaladas.`;
  else cierre = `Se recomienda formalizar un plan de mejora con metas claras, plazos definidos y seguimiento quincenal o mensual por parte de la jefatura inmediata y Recursos Humanos, a fin de revertir oportunamente los resultados obtenidos.`;

  return { apertura, parrafoDims, fortalezasTxt, oportunidadesTxt, cierre };
}

/* ---------- PASO A PASO: Nueva evaluación ---------- */
function renderWizard(){
  const draft = state.draft;
  const steps = wizardSteps(draft);
  const key = steps[state.step];
  const pct = Math.round(((state.step)/(steps.length-1||1))*100);

  const stepperHTML = steps.map((k,i)=>{
    const label = k==='general' ? 'Datos generales' : DIMENSIONS.find(d=>d.id===k).name;
    const cls = i===state.step ? 'current' : (i<state.step ? 'done' : '');
    return `<div class="step-item ${cls}" ${i<state.step?`onclick="goToStep(${i})" style="cursor:pointer"`:''}>
      <div class="step-dot">${i<state.step?'✓':(i+1)}</div>
      <div class="step-label">${esc(label)}</div>
    </div>`;
  }).join('');

  let content;
  if(key==='general') content = renderGeneralStep(draft);
  else content = renderDimensionStep(DIMENSIONS.find(d=>d.id===key), draft);

  return `
  <div class="wizard">
    <nav class="stepper no-print">${stepperHTML}</nav>
    <div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label"><span>Paso ${state.step+1} de ${steps.length}</span><span>${pct}% completado</span></div>
      ${(draft.nombre || Object.keys(draft.respuestas).length) ? `<div class="no-print" style="text-align:right;margin-top:8px;"><button class="btn btn-danger btn-sm" onclick="discardDraft()">Descartar esta evaluación</button></div>` : ''}
      <div class="card card-pad" style="margin-top:10px;">
        ${content}
      </div>
    </div>
  </div>`;
}

/* ---------- Vista Resumen ---------- */
function setSearch(v){ state.search = v; render(); }
function summaryStats(){
  const evals = state.evaluations;
  const n = evals.length;
  const avgAll = n ? evals.reduce((a,e)=>a+e.overall,0)/n : 0;
  const pctExcelente = n ? Math.round(evals.filter(e=>e.ratingLabel==='Excelente').length/n*100) : 0;
  const pctMejora = n ? Math.round(evals.filter(e=>e.overall<3.0).length/n*100) : 0;
  return {n, avgAll, pctExcelente, pctMejora};
}
function renderSummaryView(){
  const stats = summaryStats();
  if(!state.evaluations.length){
    return `
    <div class="empty-state card" style="margin-top:28px;">
      <div class="big">📋</div>
      <h2 class="section-title">Aún no hay evaluaciones guardadas</h2>
      <p class="section-sub">Completa tu primera evaluación de desempeño para ver aquí el resumen consolidado del equipo.</p>
      <button class="btn btn-primary" style="margin-top:8px;" onclick="setView('wizard')">Comenzar primera evaluación →</button>
    </div>`;
  }
  const q = state.search.trim().toLowerCase();
  let list = state.evaluations.filter(e =>
    !q || (e.nombre||'').toLowerCase().includes(q) || (e.cargo||'').toLowerCase().includes(q) || (e.departamento||'').toLowerCase().includes(q)
  );
  list = [...list].sort((a,b)=>b.overall-a.overall);

  return `
  <div style="margin-top:28px;">
    <h2 class="section-title">Resumen de evaluaciones</h2>
    <p class="section-sub">Vista consolidada de todos los colaboradores evaluados en esta sesión.</p>
    <div class="grid-4">
      <div class="kpi k1"><div class="kpi-label">Colaboradores evaluados</div><div class="kpi-value">${stats.n}</div></div>
      <div class="kpi k2"><div class="kpi-label">Promedio general</div><div class="kpi-value">${fmtScore(stats.avgAll)}</div></div>
      <div class="kpi k3"><div class="kpi-label">% Excelente</div><div class="kpi-value">${stats.pctExcelente}%</div></div>
      <div class="kpi k4"><div class="kpi-label">% Requiere plan de mejora</div><div class="kpi-value">${stats.pctMejora}%</div></div>
    </div>

    <div class="toolbar">
      <input class="search-input" type="text" placeholder="Buscar por nombre, cargo o departamento…" value="${esc(state.search)}" oninput="setSearch(this.value)">
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" onclick="exportBackup()">⬇ Exportar respaldo (JSON)</button>
        <button class="btn btn-ghost btn-sm" onclick="triggerImport()">⬆ Importar respaldo</button>
        <input type="file" id="import-file-input" accept="application/json" style="display:none" onchange="handleImportFile(this)">
      </div>
    </div>

    <div class="card" style="overflow:auto;">
      <table class="data-table">
        <thead><tr>
          <th>Colaborador</th><th>Cargo</th><th>Departamento</th><th>Nivel</th><th>Promedio</th><th>Calificación</th><th>Fecha</th><th></th>
        </tr></thead>
        <tbody>
          ${list.map(e=>{
            const r = ratingFor(e.overall);
            return `<tr>
              <td style="font-weight:700;">${esc(e.nombre)}</td>
              <td>${esc(e.cargo)}</td>
              <td>${esc(e.departamento)}</td>
              <td>${esc(e.nivel)}</td>
              <td style="font-family:var(--font-mono);font-weight:700;">${fmtScore(e.overall)}</td>
              <td><span class="pill" style="background:var(${r.soft});color:var(${r.var});">${r.label}</span></td>
              <td>${fmtDate(new Date(e.guardadoEn).toISOString().slice(0,10))}</td>
              <td class="row-actions">
                <button class="btn btn-ghost btn-sm" onclick="openReport('${e.id}')">Ver informe</button>
                <button class="btn btn-icon btn-danger btn-sm" onclick="deleteEvaluation('${e.id}')" title="Eliminar">✕</button>

  </div>`;
}

      <div class="card card-pad">
        <h3 style="font-size:16px;margin-bottom:14px;color:var(--rate-2);">▲ Áreas de oportunidad</h3>
        <ul class="list-highlight">${bottom.map(t=>`<li><div><div class="txt">${esc(t.text)}</div><div class="dim">${esc(t.dimName)}</div></div><div class="score" style="color:var(--rate-2);">${t.score}/5</div></li>`).join('')}</ul>
      </div>
    </div>

    <div class="card card-pad" style="margin-top:18px;">
      <h3 style="font-size:16px;margin-bottom:14px;">Plan de acción</h3>
      <table class="plan-table">
        <thead><tr><th>Objetivo</th><th>Acción</th><th>Fecha compromiso</th></tr></thead>
        <tbody>${(ev.plan||[]).filter(r=>r.objetivo||r.accion||r.fecha).map(r=>`
          <tr><td>${esc(r.objetivo)||'—'}</td><td>${esc(r.accion)||'—'}</td><td>${r.fecha?fmtDate(r.fecha):'—'}</td></tr>`).join('') || '<tr><td colspan="3" style="color:var(--ink-faint);">Sin acciones registradas.</td></tr>'}
        </tbody>
      </table>
    </div>

    <div class="card card-pad" style="margin-top:18px;">
      <h3 style="font-size:16px;margin-bottom:6px;">Firmas</h3>
      <div class="sig-grid">
        <div class="sig-box"><div class="sig-line">${esc(ev.firmaEvaluador)||'\u00A0'}<br><span style="font-size:11px;">Firma del evaluador/a</span></div></div>
        <div class="sig-box"><div class="sig-line">${esc(ev.firmaEvaluado)||'\u00A0'}<br><span style="font-size:11px;">Firma del colaborador/a</span></div></div>
      </div>
      <p style="margin-top:14px;color:var(--ink-soft);font-size:13px;">Fecha: ${ev.fechaFirma?fmtDate(ev.fechaFirma):'—'}</p>
    </div>
  </div>`;
}

/* ===========================================================================
   INICIALIZACIÓN
   ========================================================================= */
function init(){
  state.evaluations = loadEvaluations();
  const savedDraft = loadDraft();
  if(savedDraft && (savedDraft.nombre || Object.keys(savedDraft.respuestas||{}).length)){
    state.draft = Object.assign(emptyDraft(), savedDraft);
    setTimeout(()=>showToast('Se restauró una evaluación en curso.','info'), 300);
  }
  render();
  if(!storageOK){
    setTimeout(()=>showToast('El almacenamiento local no está disponible; los datos no se guardarán entre sesiones.','err'), 600);
  }
}
document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
